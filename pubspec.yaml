name: base_project
description: So Like App Base Project

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.6
  auto_route: 8.0.0
  auto_route_generator: 8.0.0
  hive: 2.2.3
  riverpod: 2.5.1
  flutter_riverpod: 2.5.1
  hooks_riverpod: 2.5.1
  flutter_flavorizr: 2.2.2
  in_app_review: 2.0.9
  flutter_svg: 2.0.10+1
  freezed_annotation: 2.4.1
  json_annotation: 4.8.1
  flutter_local_notifications: 17.0.0
  easy_localization: 3.0.5
  flutter_native_splash: 2.4.0
  upgrader: 10.0.1
  dio: 5.4.1
  flutter_dotenv: 5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 3.0.1
  build_runner: 2.4.8
  freezed: 2.4.7
  json_serializable: 6.7.1

flutter:
  uses-material-design: true

  assets:
    # Languages
    - assets/lang/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

analyzer:
  errors:
    invalid_annotation_target: ignore

flavorizr:
  app:
    android:
      flavorDimensions: 'default'

  flavors:
    dev:
      app:
        name: 'Dev So Like App'
        icon: 'public/assets/app_icon/icon.png'
      android:
        applicationId: 'app.solike.dev'
        firebase:
          config: '.firebase/dev/google-services.json'
      ios:
        bundleId: 'app.solike.dev'
        firebase:
          config: '.firebase/dev/GoogleService-Info.plist'
    beta:
      app:
        name: 'Beta So Like App'
        icon: 'public/assets/app_icon/icon.png'
      android:
        applicationId: 'app.solike.beta'
        firebase:
          config: '.firebase/beta/google-services.json'
      ios:
        bundleId: 'app.solike.beta'
        firebase:
          config: '.firebase/beta/GoogleService-Info.plist'
    prod:
      app:
        name: 'So Like App'
        icon: 'public/assets/app_icon/icon.png'
      android:
        applicationId: 'app.solike'
        firebase:
          config: '.firebase/prod/google-services.json'
      ios:
        bundleId: 'app.solike'
        firebase:
          config: '.firebase/prod/GoogleService-Info.plist'
