name: base_project
description: So Like App Base Project

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  auto_route: ^10.0.1
  auto_route_generator: ^10.0.1
  hive: 2.2.3
  riverpod: ^3.0.1
  flutter_riverpod: ^3.0.1
  hooks_riverpod: ^3.0.1
  flutter_flavorizr: ^2.4.0
  in_app_review: ^2.0.11
  flutter_svg: ^2.2.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_local_notifications: ^19.1.0
  easy_localization: ^3.0.7+1
  flutter_native_splash: ^2.4.6
  upgrader: ^12.1.0
  dio: ^5.8.0+1
  flutter_dotenv: ^6.0.0
  wolt_modal_sheet: ^0.11.0
  pretty_dio_logger: ^1.4.0
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  analyzer: ^7.4.5
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    # Languages
    - assets/lang/
    - .env
    - .env_dev
    - .env_beta
    - .env_prod

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

analyzer:
  errors:
    invalid_annotation_target: ignore

flavorizr:
  app:
    android:
      flavorDimensions: 'default'

  flavors:
    dev:
      app:
        name: 'Dev So Like App'
        icon: 'public/assets/app_icon/icon.png'
      android:
        applicationId: 'app.solike.dev'
        firebase:
          config: '.firebase/dev/google-services.json'
      ios:
        bundleId: 'app.solike.dev'
        firebase:
          config: '.firebase/dev/GoogleService-Info.plist'
    beta:
      app:
        name: 'Beta So Like App'
        icon: 'public/assets/app_icon/icon.png'
      android:
        applicationId: 'app.solike.beta'
        firebase:
          config: '.firebase/beta/google-services.json'
      ios:
        bundleId: 'app.solike.beta'
        firebase:
          config: '.firebase/beta/GoogleService-Info.plist'
    prod:
      app:
        name: 'So Like App'
        icon: 'public/assets/app_icon/icon.png'
      android:
        applicationId: 'app.solike'
        firebase:
          config: '.firebase/prod/google-services.json'
      ios:
        bundleId: 'app.solike'
        firebase:
          config: '.firebase/prod/GoogleService-Info.plist'
